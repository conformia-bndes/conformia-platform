[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conformia-backend"
version = "0.1.0"
description = "Backend Core e Pipeline IDP do Conform.IA BNDES"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Conform.IA BNDES Team", email = "devops@conformia-bndes.org" }
]
dependencies = [
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn[standard]>=0.28.0,<0.33.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlalchemy>=2.0.28,<2.1.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "celery>=5.3.6,<6.0.0",
    "redis>=5.0.3,<6.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "pytesseract>=0.3.10,<0.4.0",
    "Pillow>=10.2.0,<11.0.0",
    "pypdf>=4.1.0,<5.0.0",
    "python-multipart>=0.0.9,<0.1.0",
    "httpx>=0.27.0,<0.28.0",
    "minio>=7.2.5,<8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.6,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "flake8>=7.0.0,<8.0.0",
    "black>=24.3.0,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "mypy>=1.9.0,<2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
python_files = "test_*.py"
asyncio_mode = "auto"
