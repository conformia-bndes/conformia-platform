name: OpenSSF Scorecard - Seguranca da Cadeia de Suprimentos

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"  # segundas-feiras, 07:23 UTC
  workflow_dispatch:

# O Scorecard exige permissoes minimas no nivel do workflow.
permissions: read-all

jobs:
  analysis:
    name: Analise do Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # envio do SARIF para a aba Security
      id-token: write         # publicacao dos resultados (repositorio publico)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Executar analise
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Guardar resultado como artefato
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14

      - name: Enviar para a aba Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
