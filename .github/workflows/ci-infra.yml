# Area "Infra": Lint (workflows, compose, hadolint) e Stack (imagens e stack completa em Compose:
# smoke, contrato da API, carga e resiliencia) comecam juntos.
# Workflow reutilizavel, chamado pelo ci.yml. Cada grupo de jobs tem seu proprio escopo.
name: CI - Infra

on:
  workflow_call:
    inputs:
      workflows:
        description: "Rodar o lint dos workflows"
        type: boolean
        default: true
      stack:
        description: "Validar o compose e rodar o smoke da stack"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Verificacoes baratas juntas: lint dos workflows e validacao do compose.
  lint:
    name: Lint
    if: inputs.workflows || inputs.stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: inputs.workflows
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Estrutura dos workflows (needs, uses e inputs)
        if: inputs.workflows
        run: uv run --frozen python scripts/check_workflows.py

      - name: actionlint (workflows)
        if: inputs.workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: hadolint (Dockerfiles)
        if: inputs.stack
        run: |
          for dockerfile in infra/Dockerfile.backend infra/Dockerfile.frontend; do
            echo "== $dockerfile"
            docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
              hadolint --failure-threshold info - < "$dockerfile"
          done

      - name: Validar o docker-compose.yml
        if: inputs.stack
        run: |
          bash scripts/setup-env.sh
          docker compose --env-file .env -f infra/docker-compose.yml config --quiet

  smoke:
    name: Stack
    if: inputs.stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Imagens construidas com cache de camadas do GitHub Actions e carregadas no Docker;
      # o compose usa essas imagens (nomes fixos em docker-compose.yml) sem novo build.
      - name: Build da imagem do backend (com cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile.backend
          target: runtime
          tags: conformia/backend:local
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build da imagem do frontend (com cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile.frontend
          target: development
          tags: conformia/frontend:local
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Gerar .env efemero (segredos aleatorios)
        run: bash scripts/setup-env.sh

      - name: Subir a stack e aguardar saude
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml \
            up -d --no-build --wait --wait-timeout 240

      - name: Smoke (upload -> fila -> worker)
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml \
            exec -T backend python scripts/smoke_test.py

      # Contrato da API gerado a partir do OpenAPI: nenhuma resposta 5xx, respostas conformes ao
      # esquema e tipos de conteudo corretos. (A checagem de autenticacao em modo producao e feita
      # por testes de unidade que percorrem todas as rotas.)
      - name: Fuzz de contrato da API (Schemathesis)
        run: |
          docker run --rm --network host schemathesis/schemathesis@sha256:57cdf625c01901bc050355225251a7fc255c0cd8a07d4ac77fb86e4d3ffb25a2 \
            run http://127.0.0.1:8000/api/v1/openapi.json \
            --checks not_a_server_error,response_schema_conformance,content_type_conformance \
            --max-examples 50 --workers 4 --no-color

      - name: Teste de carga (k6)
        run: |
          docker run --rm -i --network host \
            -e BASE_URL=http://127.0.0.1:8000 -e VUS=20 -e DURATION=20s \
            -e P95_READ_MS=1500 -e P95_HEALTH_MS=1500 -e P95_UPLOAD_MS=4000 \
            grafana/k6@sha256:3e4186aea62e11a45560bfc51e19eeafe82fc07ce069c78aff44b7ff893d9a5e run --quiet --no-color - < tests/load/api.js

      # Derruba Redis, MinIO e Postgres, um por vez: a API deve degradar com 503, manter o
      # healthcheck rapido e se recuperar sozinha. Roda por ultimo porque mexe na stack.
      - name: Resiliencia (queda e recuperacao das dependencias)
        run: bash scripts/resilience_test.sh

      - name: Estado e logs em caso de falha
        if: failure()
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml ps -a
          docker compose --env-file .env -f infra/docker-compose.yml logs --tail=200

      - name: Encerrar a stack
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v --remove-orphans
