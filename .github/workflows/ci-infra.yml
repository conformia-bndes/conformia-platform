# Area "Infra": lint (workflows e compose) e smoke da stack completa, em paralelo.
# Workflow reutilizavel, chamado pelo ci.yml. Cada grupo de jobs tem seu proprio escopo.
name: CI - Infra

on:
  workflow_call:
    inputs:
      workflows:
        description: "Rodar o lint dos workflows"
        type: boolean
        default: true
      stack:
        description: "Validar o compose e rodar o smoke da stack"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Verificacoes baratas juntas: lint dos workflows e validacao do compose.
  lint:
    name: Lint
    if: inputs.workflows || inputs.stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (workflows)
        if: inputs.workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Validar o docker-compose.yml
        if: inputs.stack
        run: |
          bash scripts/setup-env.sh
          docker compose --env-file .env -f infra/docker-compose.yml config --quiet

  smoke:
    name: Smoke
    if: inputs.stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Imagens construidas com cache de camadas do GitHub Actions e carregadas no Docker;
      # o compose usa essas imagens (nomes fixos em docker-compose.yml) sem novo build.
      - name: Build da imagem do backend (com cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile.backend
          target: runtime
          tags: conformia/backend:local
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build da imagem do frontend (com cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile.frontend
          target: development
          tags: conformia/frontend:local
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Gerar .env efemero (segredos aleatorios)
        run: bash scripts/setup-env.sh

      - name: Subir a stack e aguardar saude
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml \
            up -d --no-build --wait --wait-timeout 240

      - name: Smoke test (upload -> fila -> worker)
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml \
            exec -T backend python scripts/smoke_test.py

      - name: Estado e logs em caso de falha
        if: failure()
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml ps -a
          docker compose --env-file .env -f infra/docker-compose.yml logs --tail=200

      - name: Encerrar a stack
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v --remove-orphans
