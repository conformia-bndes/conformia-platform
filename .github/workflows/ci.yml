# ==============================================================================
# CI - Conform.IA BNDES Platform (orquestrador)
#
# Estagios (cada area e um workflow reutilizavel ci-*.yml, com seus proprios estagios internos:
# Qualidade -> Validacao -> "<Area> OK"):
#
#   1. Escopo      changes  -> detecta o que mudou no PR (backend, frontend, infra, docs, workflows)
#   2. Areas       Repo, Backend, Frontend, Infra e Docs, em paralelo entre si; areas sem mudanca
#                  relevante sao puladas
#   3. Gate        CI OK    -> consolida as areas; check unico exigido nos rulesets de main e dev
#                              (area pulada por falta de mudanca aprova; falha ou cancelamento
#                              bloqueia)
#   4. Publicacao  Publicar documentacao -> so em push para main, depois do CI OK verde
#
# O deploy das imagens (GHCR) e o cd.yml, so em release (release.yml). O titulo do PR e validado
# em pr-title.yml.
#
# Em push para main/dev, execucao manual e agendada tudo roda, sem filtro de caminho.
# Actions de terceiros e oficiais fixadas por SHA; o Dependabot mantem as versoes.
# ==============================================================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    # Segunda 06:00 UTC: roda tudo em main para pegar avisos novos de seguranca nas dependencias.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Em PRs, um push novo cancela a execucao anterior; em main/dev cada commit e validado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  UV_FROZEN: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Escopo
  # ---------------------------------------------------------------------------
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      docs: ${{ steps.scope.outputs.docs }}
      stack: ${{ steps.scope.outputs.stack }}
      workflows: ${{ steps.scope.outputs.workflows }}
      infra: ${{ steps.scope.outputs.infra }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false

      - name: Filtrar caminhos alterados
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - "backend/**"
              - "rules/**"
              - "evals/**"
              - "pyproject.toml"
              - "uv.lock"
            frontend:
              - "frontend/**"
            infra:
              - "infra/**"
              - "scripts/**"
              - ".env.example"
            docs:
              - "docs/**"
              - "docs_hooks/**"
              - "mkdocs.yml"
              - "README.md"
              - "pyproject.toml"
              - "uv.lock"
            workflows:
              - ".github/workflows/**"
            deps:
              - "pyproject.toml"
              - "backend/pyproject.toml"
              - "uv.lock"

      - name: Definir escopo
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          INFRA: ${{ steps.filter.outputs.infra }}
          DOCS: ${{ steps.filter.outputs.docs }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          DEPS: ${{ steps.filter.outputs.deps }}
        run: |
          # Fora de PR, ou se os proprios workflows mudaram, tudo roda.
          all=false
          if [ "$EVENT" != "pull_request" ] || [ "$WORKFLOWS" = "true" ]; then all=true; fi
          pick() { if [ "$all" = "true" ] || [ "$1" = "true" ]; then echo true; else echo false; fi; }
          stack=false
          if [ "$BACKEND" = "true" ] || [ "$FRONTEND" = "true" ] || [ "$INFRA" = "true" ]; then
            stack=true
          fi
          workflows=false
          if [ "$EVENT" != "pull_request" ] || [ "$WORKFLOWS" = "true" ]; then workflows=true; fi
          {
            echo "backend=$(pick "$BACKEND")"
            echo "frontend=$(pick "$FRONTEND")"
            echo "docs=$(pick "$DOCS")"
            echo "stack=$(pick "$stack")"
            echo "workflows=$workflows"
            # Matriz completa de Python so em push/agendado, mudanca de dependencias ou de workflows.
            if [ "$EVENT" != "pull_request" ] || [ "$DEPS" = "true" ] || [ "$WORKFLOWS" = "true" ]; then
              echo "full_matrix=true"
            else
              echo "full_matrix=false"
            fi
            # A area Infra roda se houver mudanca em workflows ou na stack.
            if [ "$workflows" = "true" ] || [ "$(pick "$stack")" = "true" ]; then
              echo "infra=true"
            else
              echo "infra=false"
            fi
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Areas (workflows reutilizaveis, em paralelo)
  # ---------------------------------------------------------------------------
  repo:
    name: Repo
    needs: changes
    uses: ./.github/workflows/ci-repo.yml

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
    with:
      full_matrix: ${{ needs.changes.outputs.full_matrix == 'true' }}

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  infra:
    name: Infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml
    with:
      workflows: ${{ needs.changes.outputs.workflows == 'true' }}
      stack: ${{ needs.changes.outputs.stack == 'true' }}

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # datas de revisao das paginas vem do historico git
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build do MkDocs em modo estrito (inclui a verificacao do site)
        run: uv run mkdocs build --strict

  # ---------------------------------------------------------------------------
  # Check unico exigido nos rulesets
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, repo, backend, frontend, infra, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar resultado
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Resultado do CI"
            echo
            echo "| Estagio | Resultado |"
            echo "| :-- | :-- |"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::Ha areas com falha ou canceladas."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Publicacao da documentacao (so em push para main, com o CI verde)
  # ---------------------------------------------------------------------------
  docs-deploy:
    name: Publicar documentacao
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ok.result == 'success'
    permissions:
      contents: read
      actions: read # baixar os artefatos de relatorio desta execucao
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      use_current_run: true
