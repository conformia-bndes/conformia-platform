# ==============================================================================
# CI - Conform.IA BNDES Platform (orquestrador)
#
#   changes  -> detecta o que mudou no PR (backend, frontend, infra, docs, workflows)
#   areas    -> Repo, Backend, Frontend, Infra: workflows reutilizaveis (ci-*.yml). Cada area
#               agrupa o que e barato num job e separa so o que e pesado (testes, fuzz, smoke);
#               areas sem mudanca relevante sao puladas. Sao ~10 jobs no total
#   docs     -> build estrito da documentacao
#   CI OK    -> consolida o resultado das areas; check unico exigido nos rulesets de main e dev
#               (area pulada por falta de mudanca aprova; falha ou cancelamento bloqueia)
#
# Nenhuma area espera a outra: o caminho critico e o job mais lento (hoje, o smoke ou os
# testes do backend). O titulo do PR e validado em pr-title.yml.
#
# Em push para main/dev, execucao manual e agendada tudo roda, sem filtro de caminho.
# Actions de terceiros e oficiais fixadas por SHA; o Dependabot mantem as versoes.
# ==============================================================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    # Segunda 06:00 UTC: roda tudo em main para pegar avisos novos de seguranca nas dependencias.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Em PRs, um push novo cancela a execucao anterior; em main/dev cada commit e validado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  UV_FROZEN: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Escopo
  # ---------------------------------------------------------------------------
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      docs: ${{ steps.scope.outputs.docs }}
      stack: ${{ steps.scope.outputs.stack }}
      workflows: ${{ steps.scope.outputs.workflows }}
      infra: ${{ steps.scope.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false

      - name: Filtrar caminhos alterados
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - "backend/**"
              - "rules/**"
              - "evals/**"
              - "pyproject.toml"
              - "uv.lock"
            frontend:
              - "frontend/**"
            infra:
              - "infra/**"
              - "scripts/**"
              - ".env.example"
            docs:
              - "docs/**"
              - "docs_hooks/**"
              - "mkdocs.yml"
              - "README.md"
              - "pyproject.toml"
              - "uv.lock"
            workflows:
              - ".github/workflows/**"

      - name: Definir escopo
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          INFRA: ${{ steps.filter.outputs.infra }}
          DOCS: ${{ steps.filter.outputs.docs }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          # Fora de PR, ou se os proprios workflows mudaram, tudo roda.
          all=false
          if [ "$EVENT" != "pull_request" ] || [ "$WORKFLOWS" = "true" ]; then all=true; fi
          pick() { if [ "$all" = "true" ] || [ "$1" = "true" ]; then echo true; else echo false; fi; }
          stack=false
          if [ "$BACKEND" = "true" ] || [ "$FRONTEND" = "true" ] || [ "$INFRA" = "true" ]; then
            stack=true
          fi
          workflows=false
          if [ "$EVENT" != "pull_request" ] || [ "$WORKFLOWS" = "true" ]; then workflows=true; fi
          {
            echo "backend=$(pick "$BACKEND")"
            echo "frontend=$(pick "$FRONTEND")"
            echo "docs=$(pick "$DOCS")"
            echo "stack=$(pick "$stack")"
            echo "workflows=$workflows"
            # A area Infra roda se houver mudanca em workflows ou na stack.
            if [ "$workflows" = "true" ] || [ "$(pick "$stack")" = "true" ]; then
              echo "infra=true"
            else
              echo "infra=false"
            fi
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Areas (workflows reutilizaveis, em paralelo)
  # ---------------------------------------------------------------------------
  repo:
    name: Repo
    uses: ./.github/workflows/ci-repo.yml

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  infra:
    name: Infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml
    with:
      workflows: ${{ needs.changes.outputs.workflows == 'true' }}
      stack: ${{ needs.changes.outputs.stack == 'true' }}

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # datas de revisao das paginas vem do historico git
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build do MkDocs em modo estrito (inclui a verificacao do site)
        run: uv run mkdocs build --strict

  # ---------------------------------------------------------------------------
  # Check unico exigido nos rulesets
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, repo, backend, frontend, infra, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar resultado
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::Ha areas com falha ou canceladas."
            exit 1
          fi
