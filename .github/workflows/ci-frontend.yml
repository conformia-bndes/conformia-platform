# Area "Frontend", em estagios:
#   1. Qualidade : Lint e Security (rapidos; falhar aqui evita gastar o resto)
#   2. Validacao : Build da imagem + Trivy e Test, em paralelo
#   3. Gate      : "Frontend OK" consolida a area
# O deploy (imagem no GHCR) e o cd.yml, so em release.
# Workflow reutilizavel, chamado pelo ci.yml. Gera os artefatos "relatorio-frontend-*".
name: CI - Frontend

on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        working-directory: frontend
        run: |
          mkdir -p ../reports
          npm audit --json > ../reports/npm-audit.json || true
          npm audit --audit-level=high

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-frontend-security
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build de producao (Vite)
        working-directory: frontend
        run: npm run build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Data para invalidar o cache do apk upgrade
        id: stamp
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build da imagem de producao do frontend (sem publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile.frontend
          target: production
          build-args: |
            UPGRADE_STAMP=${{ steps.stamp.outputs.date }}
          push: false
          load: true
          tags: scan/frontend:ci
          cache-from: type=gha,scope=frontend-production
          cache-to: type=gha,scope=frontend-production,mode=max

      - name: Cache do banco de vulnerabilidades do Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Scan de vulnerabilidades da imagem (Trivy)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scan/frontend:ci

  test:
    name: Test
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Vitest
        working-directory: frontend
        run: |
          mkdir -p ../reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=../reports/junit-frontend.xml

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-frontend-tests
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Estagio final: consolida a area em um unico no do grafo
  # ---------------------------------------------------------------------------
  gate:
    name: Frontend OK
    if: always()
    needs: [lint, security, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar resultado da area
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Frontend"
            echo
            echo "| Job | Resultado |"
            echo "| :-- | :-- |"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::Frontend: ha jobs com falha ou cancelados."
            exit 1
          fi
