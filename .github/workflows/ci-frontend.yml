# Area "Frontend": ESLint, testes, build de producao e auditoria num unico job (cada etapa leva
# poucos segundos; separar em jobs custaria mais em preparacao do que ganharia em paralelismo).
# Workflow reutilizavel, chamado pelo ci.yml. Gera o relatorio "relatorio-frontend".
name: CI - Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: |
          mkdir -p ../reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=../reports/junit-frontend.xml

      - name: Typecheck e build de producao
        working-directory: frontend
        run: npm run build

      - name: Auditoria de dependencias (npm audit)
        working-directory: frontend
        run: |
          npm audit --json > ../reports/npm-audit.json || true
          npm audit --audit-level=high

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-frontend
          path: reports/
          if-no-files-found: warn
          retention-days: 30
