name: PR Title

# Separado do CI: roda tambem quando o PR e editado, sem disparar o pipeline inteiro.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Titulo do PR (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tipos aceitos espelham o template de PR do repositorio
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            build
            perf
            revert
            sec
            infra
          requireScope: false

      - name: Verificar politica de Code Freeze (01/12/2026)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          CODE_FREEZE_DATE: "2026-12-01"
          RELEASE_DATE: "2026-12-05"
        run: |
          today="$(date -u +%Y-%m-%d)"
          if [[ "$today" > "$CODE_FREEZE_DATE" || "$today" == "$CODE_FREEZE_DATE" ]] && [[ "$today" < "$RELEASE_DATE" || "$today" == "$RELEASE_DATE" ]]; then
            if [[ "$PR_TITLE" =~ ^feat(\(.*\))?!?: ]]; then
              echo "::error::Code freeze ativo desde 01/12/2026: novas funcionalidades (feat) estao bloqueadas. Apenas correcoes de defeitos bloqueadores (fix, sec, revert) sao permitidas."
              exit 1
            fi
          fi
