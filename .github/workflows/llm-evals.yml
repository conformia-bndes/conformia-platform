name: LLM Evals - Maker-Checker (promptfoo)

# Execucao manual: consome creditos do provedor de LLM e exige o segredo OPENAI_API_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promptfoo:
    name: Testes de comportamento do Maker-Checker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificar segredo do provedor
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Segredo OPENAI_API_KEY ausente; sem ele os testes nao medem o LLM."
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Sincronizar dependencias do backend
        run: uv sync --all-packages --frozen

      - name: Executar promptfoo
        run: |
          mkdir -p evals/reports
          uv run --frozen npx --yes promptfoo@0.125.1 eval \
            -c evals/promptfoo/promptfooconfig.yaml \
            -o evals/reports/promptfoo.json --no-cache

      - name: Publicar resultado
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptfoo-report
          path: evals/reports/promptfoo.json
          if-no-files-found: warn
          retention-days: 30
