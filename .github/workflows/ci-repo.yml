# Area "Repo": higiene do repositorio e varredura de segredos.
# Workflow reutilizavel, chamado pelo ci.yml.
name: CI - Repo

on:
  workflow_call:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Cache dos ambientes do pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # black e flake8 rodam na area Backend e o gitleaks no job Secrets; aqui ficam so os
      # hooks de higiene (YAML, JSON, conflitos, chaves privadas, espacos e fim de arquivo).
      - name: Hooks de higiene
        env:
          SKIP: black,flake8,gitleaks
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historico completo para o gitleaks
          persist-credentials: false

      - name: Instalar Gitleaks (checksum verificado)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  /tmp/$archive" | sha256sum -c -
          tar -xzf "/tmp/$archive" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Varredura de segredos no historico
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
