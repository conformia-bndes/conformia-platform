# Publicacao da documentacao
#
# Publica o site via artefato do GitHub Pages (Settings -> Pages: "GitHub Actions").
# Nao usa "mkdocs gh-deploy": a branch gh-pages nao e necessaria nem mantida.
#
# Chamado pelo ci.yml no estagio de publicacao: so em push para main, depois do CI OK verde, na
# mesma execucao do CI. Por isso o checkout e o do proprio commit do push (nunca um SHA vindo de
# outro workflow ou de PR) e os artefatos "relatorio-*" (testes, cobertura, evals, fuzzing e
# auditorias) sao os desta execucao. A execucao manual (workflow_dispatch) so vale em main e usa
# os relatorios da ultima execucao verde do CI em main.
name: Docs Deploy

on:
  workflow_call:
    inputs:
      use_current_run:
        description: "Usar os relatorios da execucao atual (chamada pelo ci.yml)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      use_current_run:
        description: "Usar os relatorios da execucao atual (somente quando chamado pelo ci.yml)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build do site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # baixar os artefatos de relatorio da execucao do CI
    steps:
      - name: Resolver a execucao dos relatorios
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ inputs.use_current_run }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$CURRENT" = "true" ]; then
            RUN_ID="$CURRENT_RUN_ID"
            RUN_SHA="$CURRENT_SHA"
          else
            read -r RUN_ID RUN_SHA < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --status success --limit 1 \
              --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Nenhuma execucao verde do CI em main encontrada."
            exit 1
          fi
          {
            echo "run_id=$RUN_ID"
            echo "sha=$RUN_SHA"
          } >> "$GITHUB_OUTPUT"

      # Sem `ref`: o checkout e sempre o commit que disparou esta execucao em main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # datas de revisao das paginas vem do historico git
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Baixar os relatorios do CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relatorio-*
          path: reports
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build do MkDocs (dependencias fixadas no uv.lock)
        env:
          REPORT_COMMIT: ${{ steps.ci.outputs.sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.ci.outputs.run_id }}
        run: |
          REPORT_DATE="$(date -u +'%d/%m/%Y %H:%M UTC')" uv run --frozen mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
