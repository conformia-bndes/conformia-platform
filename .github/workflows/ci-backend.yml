# Area "Backend", em estagios:
#   1. Qualidade : Lint e Security (rapidos; falhar aqui evita gastar o resto)
#   2. Validacao : Build da imagem + Trivy, Test, Evals e Fuzz, em paralelo
#   3. Gate      : "Backend OK" consolida a area
# O deploy (imagem no GHCR) e o cd.yml, so em release.
# Workflow reutilizavel, chamado pelo ci.yml. Gera os artefatos "relatorio-*" que o docs.yml
# publica na documentacao.
name: CI - Backend

on:
  workflow_call:
    inputs:
      full_matrix:
        description: "Testar tambem o Python 3.12 (push em main/dev e mudanca de dependencias)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  # Testes usam SQLite e dependencias simuladas: nenhum servico externo e necessario.
  ENVIRONMENT: test
  ALLOW_ANONYMOUS_ACCESS: "true"
  DATABASE_URL: sqlite:///./ci-backend.db
  REDIS_URL: redis://127.0.0.1:6379/0
  MINIO_ENDPOINT: 127.0.0.1:9

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar ferramentas (versoes do uv.lock)
        run: uv sync --all-packages --all-extras

      - name: black
        run: uv run black --check backend/ docs_hooks/ evals/compare_baseline.py

      - name: flake8
        run: uv run flake8 backend/ docs_hooks/ evals/compare_baseline.py --max-line-length=100

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: pip-audit (uv.lock completo)
        run: |
          mkdir -p reports
          uv export --all-packages --all-extras --no-emit-workspace --no-hashes \
            --format requirements-txt -o /tmp/requirements-audit.txt
          uvx pip-audit@2.9.0 -r /tmp/requirements-audit.txt --no-deps --disable-pip \
            --progress-spinner off --format json --output reports/pip-audit.json

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-backend-security
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem do backend (sem publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile.backend
          target: runtime
          push: false
          load: true
          tags: scan/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Validar OCR (tesseract-ocr-por) com PDF digitalizado no container
        run: |
          # O script importa o extrator, que carrega Settings (cinco variaveis obrigatorias).
          # Valores descartaveis gerados na hora: o container nao acessa banco, fila nem MinIO.
          export SECRET_KEY="$(openssl rand -hex 16)" API_KEY="$(openssl rand -hex 16)" \
            POSTGRES_PASSWORD="$(openssl rand -hex 16)" MINIO_ROOT_USER=ocr-ci \
            MINIO_ROOT_PASSWORD="$(openssl rand -hex 16)"
          docker run --rm -e SECRET_KEY -e API_KEY -e POSTGRES_PASSWORD -e MINIO_ROOT_USER \
            -e MINIO_ROOT_PASSWORD scan/backend:ci python scripts/validate_ocr_container.py

      - name: Cache do banco de vulnerabilidades do Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # HIGH e CRITICAL com correcao disponivel reprovam. A execucao semanal do CI pega CVEs
      # publicados depois do ultimo build.
      - name: Scan de vulnerabilidades da imagem (Trivy)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scan/backend:ci

  # Matriz: o produto roda em Python 3.11; a 3.12 antecipa a compatibilidade com o ambiente
  # de desenvolvimento. Cobertura e relatorios saem so da 3.11.
  test:
    name: Test (${{ matrix.python }})
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL descartavel (so para este job) para os testes de migration em banco real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migracao
          POSTGRES_PASSWORD: migracao-descartavel
          POSTGRES_DB: migracao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migracao -d migracao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        # Em PR so a versao do produto (3.11); a matriz completa roda em push e quando as
        # dependencias mudam.
        python: ${{ fromJSON(inputs.full_matrix && '["3.11","3.12"]' || '["3.11"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar Tesseract (portugues) e Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Sincronizar dependencias
        run: uv sync --all-packages --all-extras

      - name: pytest com cobertura
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg2://migracao:migracao-descartavel@127.0.0.1:5432/migracao
        run: |
          mkdir -p reports
          uv run pytest backend/tests/ -q --durations=10 \
            --junitxml=reports/junit-backend.xml \
            --cov=backend/app --cov-report=term-missing:skip-covered \
            --cov-report=xml:reports/coverage.xml

      - name: Resumo da cobertura na execucao
        if: matrix.python == '3.11' && always()
        run: |
          {
            echo "### Cobertura do backend"
            uv run coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatorios
        if: matrix.python == '3.11' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-backend-tests
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  # MLOps: benchmark de regras com gate de regressao contra a linha de base versionada
  # (evals/baseline.json): sem falso positivo, sem queda de acuracia e sem regressao pontual.
  evals:
    name: Evals
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --all-packages --all-extras

      - name: Benchmark de regras (0 falsos positivos e acuracia minima)
        run: |
          mkdir -p reports
          uv run python evals/eval_pipeline.py --json-report reports/eval_report.json

      - name: Gate de regressao contra a linha de base
        run: uv run python evals/compare_baseline.py reports/eval_report.json

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-backend-evals
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  fuzz:
    name: Fuzz
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # O Atheris so publica wheels para Linux com Python 3.12+ (extra `fuzz` do backend).
      FUZZ_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.FUZZ_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias do backend com o extra de fuzzing
        run: uv sync --package conformia-backend --extra fuzz --python "$FUZZ_PYTHON"

      - name: Fuzzing por 60 segundos (falha em excecao ou invariante violada)
        run: |
          mkdir -p reports
          set -o pipefail
          uv run --python "$FUZZ_PYTHON" python backend/fuzz/fuzz_regras.py \
            -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee reports/fuzz.txt

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-backend-fuzz
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Estagio final: consolida a area em um unico no do grafo
  # ---------------------------------------------------------------------------
  gate:
    name: Backend OK
    if: always()
    needs: [lint, security, build, test, evals, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar resultado da area
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Backend"
            echo
            echo "| Job | Resultado |"
            echo "| :-- | :-- |"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::Backend: ha jobs com falha ou cancelados."
            exit 1
          fi
