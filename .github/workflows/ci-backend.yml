# Area "Backend": qualidade, testes (matriz de versoes do Python) e fuzzing, em paralelo.
# Workflow reutilizavel, chamado pelo ci.yml. Gera os relatorios de qualidade (artefatos
# "relatorio-*") que o docs.yml publica na documentacao.
name: CI - Backend

on:
  workflow_call:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  # Testes usam SQLite e dependencias simuladas: nenhum servico externo e necessario.
  ENVIRONMENT: test
  DATABASE_URL: sqlite:///./ci-backend.db
  REDIS_URL: redis://127.0.0.1:6379/0
  MINIO_ENDPOINT: 127.0.0.1:9

jobs:
  # Verificacoes baratas juntas (um unico uv sync): estilo, benchmark de regras e auditoria.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias
        run: uv sync --all-packages --all-extras

      - name: black
        run: uv run black --check backend/

      - name: flake8
        run: uv run flake8 backend/ --max-line-length=100

      - name: Benchmark de regras (0 falsos positivos e acuracia minima)
        run: |
          mkdir -p reports
          uv run python evals/eval_pipeline.py --json-report reports/eval_report.json

      - name: Auditoria de dependencias Python (uv.lock completo)
        run: |
          uv export --all-packages --all-extras --no-emit-workspace --no-hashes \
            --format requirements-txt -o /tmp/requirements-audit.txt
          uvx pip-audit@2.9.0 -r /tmp/requirements-audit.txt --no-deps --disable-pip \
            --progress-spinner off --format json --output reports/pip-audit.json

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-backend-quality
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  # Matriz: o produto roda em Python 3.11; a 3.12 antecipa a compatibilidade com o ambiente
  # de desenvolvimento. Cobertura e relatorios saem so da 3.11.
  tests:
    name: Tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar Tesseract (portugues) e Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Sincronizar dependencias
        run: uv sync --all-packages --all-extras

      - name: pytest com cobertura
        run: |
          mkdir -p reports
          uv run pytest backend/tests/ -q --durations=10 \
            --junitxml=reports/junit-backend.xml \
            --cov=backend/app --cov-report=term-missing:skip-covered \
            --cov-report=xml:reports/coverage.xml

      - name: Resumo da cobertura na execucao
        if: matrix.python == '3.11' && always()
        run: |
          {
            echo "### Cobertura do backend"
            uv run coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatorios
        if: matrix.python == '3.11' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-backend-tests
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # O Atheris so publica wheels para Linux com Python 3.12+ (extra `fuzz` do backend).
      FUZZ_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.FUZZ_PYTHON }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar dependencias do backend com o extra de fuzzing
        run: uv sync --package conformia-backend --extra fuzz --python "$FUZZ_PYTHON"

      - name: Fuzzing por 60 segundos (falha em excecao ou invariante violada)
        run: |
          mkdir -p reports
          set -o pipefail
          uv run --python "$FUZZ_PYTHON" python backend/fuzz/fuzz_regras.py \
            -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee reports/fuzz.txt

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-backend-fuzz
          path: reports/
          if-no-files-found: warn
          retention-days: 30
