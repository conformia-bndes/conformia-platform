version: 2
# Atualizacoes entram por dev (branch de integracao) e chegam a main na promocao.
# Patches e minors sao agrupados para reduzir o volume de PRs; majors chegam isolados.
updates:
  # uv.lock e a fonte unica de versoes (desenvolvimento, CI e imagem Docker).
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "area: backend"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "area: frontend"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area: devops"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/infra"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area: devops"
    ignore:
      # Versoes maiores do Node sao trocadas manualmente para a proxima LTS (versoes impares
      # nao tem suporte de longo prazo, como a 25 proposta no PR #69).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
