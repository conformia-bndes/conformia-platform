[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
  | node_modules
)/
'''

[project]
name = "conformia-platform"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "mkdocs-material>=9.7.7,<10",
  "mkdocs-git-revision-date-localized-plugin>=1.4,<2",
  "mkdocs-minify-plugin>=0.8,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=4.1.1",
  "flake8>=7.0.0",
  "black>=26.10.1",
  "isort>=5.13.2",
  "mypy>=1.9.0",
  "fpdf2>=2.8.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]
