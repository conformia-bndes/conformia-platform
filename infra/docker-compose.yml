# ==============================================================================
# Conform.IA BNDES Platform - Docker Compose
# ==============================================================================

services:
  # ============================================================================
  # Banco de Dados Relacional - PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: conformia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conformia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conformia_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-conformia_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conformia_user} -d ${POSTGRES_DB:-conformia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - conformia-net

  # ============================================================================
  # Mensageria & Cache - Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: conformia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - conformia-net

  # ============================================================================
  # Armazenamento de Objetos (S3 Compativel) - MinIO
  # ============================================================================
  minio:
    image: elestio/minio:latest
    container_name: conformia-minio
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - "mkdir -p /data/${MINIO_BUCKET_NAME:-documents} && exec minio server /data --console-address :9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-conformia_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-conformia_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - conformia-net

  # ============================================================================
  # Backend API - FastAPI
  # ============================================================================
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      target: runtime
    container_name: conformia-backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../backend:/app
      - ../rules:/rules:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-conformia_user}:${POSTGRES_PASSWORD:-conformia_secret_pass}@postgres:5432/${POSTGRES_DB:-conformia_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-conformia_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-conformia_minio_secret}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-documents}
      - MINIO_USE_SSL=False
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-conformia_super_secret_dev_key_change_in_prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - conformia-net

  # ============================================================================
  # Worker Assíncrono - Celery (IDP, OCR & Compliance Evaluation)
  # ============================================================================
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      target: runtime
    container_name: conformia-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app.celery", "worker", "--loglevel=info", "-E"]
    volumes:
      - ../backend:/app
      - ../rules:/rules:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-conformia_user}:${POSTGRES_PASSWORD:-conformia_secret_pass}@postgres:5432/${POSTGRES_DB:-conformia_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-conformia_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-conformia_minio_secret}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-documents}
      - MINIO_USE_SSL=False
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-conformia_super_secret_dev_key_change_in_prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - conformia-net

  # ============================================================================
  # Frontend SPA - React 18 + Vite + Tailwind CSS
  # ============================================================================
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      target: development
    container_name: conformia-frontend
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - conformia-net

networks:
  conformia-net:
    name: conformia-network
    driver: bridge

volumes:
  postgres_data:
    name: conformia_postgres_data
  redis_data:
    name: conformia_redis_data
  minio_data:
    name: conformia_minio_data
