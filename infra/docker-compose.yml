# ==============================================================================
# Conform.IA BNDES Platform - Docker Compose
#
# Uso (a partir da raiz do repositorio):
#   make env     # gera .env com segredos aleatorios (uma vez)
#   make up      # sobe a stack e espera ficar saudavel
#   make smoke   # teste de fumaça: upload -> fila -> worker -> estado
#
# Nenhum segredo vive neste arquivo: tudo vem do .env (ignorado pelo git).
# Os comandos abaixo passam --env-file .env explicitamente, porque o compose
# resolve o .env relativo a pasta do arquivo (infra/), e nao a raiz do repo.
# ==============================================================================

x-backend: &backend
  # backend e worker usam a mesma imagem; o nome explicito permite reaproveitar a imagem
  # construida com cache no CI (docker buildx bake) sem novo build no "compose up".
  image: conformia/backend:local
  build:
    context: ..
    dockerfile: infra/Dockerfile.backend
    target: runtime
  restart: unless-stopped
  env_file: ../.env
  # Dentro da rede Docker os servicos se enxergam pelo nome; estes valores
  # sobrescrevem qualquer URL pensada para execucao no host.
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-conformia_user}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (make env)}@postgres:5432/${POSTGRES_DB:-conformia_db}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
  volumes:
    - ../backend:/app
    - ../rules:/rules:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    # O MinIO nao tem healthcheck proprio (a imagem nao garante curl/mc); a prontidao
    # dele e verificada pelo /api/v1/health do backend, que testa o bucket de verdade.
    minio:
      condition: service_started
  networks:
    - conformia-net

services:
  # ============================================================================
  # Banco de Dados Relacional - PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: conformia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conformia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (make env)}
      POSTGRES_DB: ${POSTGRES_DB:-conformia_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conformia_user} -d ${POSTGRES_DB:-conformia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - conformia-net

  # ============================================================================
  # Mensageria & Cache - Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: conformia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - conformia-net

  # ============================================================================
  # Armazenamento de Objetos (S3 compativel) - MinIO
  # O repositorio oficial minio/minio foi arquivado e as imagens sairam do Docker
  # Hub; pgsty/minio e o fork mantido, compativel em API, variaveis e comandos.
  # O bucket e criado pela propria aplicacao (StorageService) no primeiro uso.
  # ============================================================================
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    container_name: conformia-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env (make env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env (make env)}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - conformia-net

  # ============================================================================
  # Backend API - FastAPI
  # ============================================================================
  backend:
    <<: *backend
    container_name: conformia-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # Saudavel somente se Postgres, Redis e MinIO responderem (status == "healthy").
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request as u; d=json.load(u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=8)); sys.exit(0 if d['status']=='healthy' else 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ============================================================================
  # Worker Assincrono - Celery (IDP, OCR & Compliance Evaluation)
  # ============================================================================
  worker:
    <<: *backend
    container_name: conformia-worker
    command: ["celery", "-A", "app.core.celery_app.celery", "worker", "--loglevel=info", "-E"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app.celery inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Frontend SPA - React 18 + Vite + Tailwind CSS
  # ============================================================================
  frontend:
    image: conformia/frontend:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      target: development
    container_name: conformia-frontend
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - conformia-net

networks:
  conformia-net:
    name: conformia-network
    driver: bridge

volumes:
  postgres_data:
    name: conformia_postgres_data
  redis_data:
    name: conformia_redis_data
  minio_data:
    name: conformia_minio_data
