# ==============================================================================
# Conform.IA BNDES Platform - Perfil de Producao / Demonstracao (Override)
#
# Uso (a partir da raiz do repositorio):
#   docker compose --env-file .env \
#     -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --wait
#
# Diferencas em relacao ao compose de desenvolvimento:
# - backend roda sem --reload, ativando multiplos processos via WEB_CONCURRENCY
#   (padrao 2; conexoes com o banco = (WEB_CONCURRENCY + CELERY_CONCURRENCY) x
#   (DB_POOL_SIZE + DB_MAX_OVERFLOW), mantendo-se abaixo do max_connections=100).
# - frontend usa o estagio "production" (Nginx sem privilegio na porta 8080).
# - codigo da aplicacao vem da imagem imutavel (sem bind mount de ../backend ou ../frontend).
# ==============================================================================

services:
  migrate:
    image: ${BACKEND_IMAGE:-conformia/backend:local}
    volumes: !reset
      - ../rules:/rules:ro

  backend:
    image: ${BACKEND_IMAGE:-conformia/backend:local}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
    volumes: !reset
      - ../rules:/rules:ro

  worker:
    image: ${BACKEND_IMAGE:-conformia/backend:local}
    command:
      - celery
      - -A
      - app.core.celery_app.celery
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - -E
    environment:
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
    volumes: !reset
      - ../rules:/rules:ro

  frontend:
    image: ${FRONTEND_IMAGE:-conformia/frontend:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      target: production
    command: ["nginx", "-g", "daemon off;"]
    volumes: !reset []
    ports: !reset
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
