site_name: "Conform.IA BNDES - Documentação Técnica"
site_description: "Plataforma de Intelligent Document Processing (IDP) e Auditoria Imutável - Consulta Pública BNDES nº 01/2025"
site_url: "https://conformia-bndes.github.io/conformia-platform/"
repo_url: "https://github.com/conformia-bndes/conformia-platform"
repo_name: "conformia-bndes/conformia-platform"

theme:
  name: material
  language: pt
  icon:
    repo: fontawesome/brands/github
  palette:
    # Modo Claro Institucional
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    # Modo Escuro de Alta Legibilidade
    - scheme: slate
      primary: slate
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

hooks:
  - docs_hooks/check_site.py

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      type: timeago
  - minify:
      minify_html: true

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Produto:
      - Visão Geral: planning/index.md
      - Requisitos e Escopo: planning/requirements.md
      - Matriz de Conformidade BNDES: bndes/compliance-matrix.md
      - Tipologias de Documentos: bndes/document-types.md
      - Rastreabilidade RF01 a RF10: planning/matriz_rastreabilidade_rf01_rf10.md
  - Arquitetura:
      - Visão Geral: architecture/overview.md
      - Decisões Arquiteturais (ADRs):
          - Índice: architecture/adr-index.md
          - ADR-001 Monorepo Modular: architecture/adr-001-monorepo-modular.md
          - ADR-002 Adoção do Astral uv: architecture/adr-002-astral-uv-toolchain.md
          - ADR-003 React SPA vs Next.js: architecture/adr-003-spa-vs-nextjs.md
          - Modelo de ADR: architecture/adr-template.md
  - Engenharia:
      - Pipeline IDP e OCR: engineering/idp-pipeline.md
      - Motor de Regras: engineering/rules-engine.md
      - Maker-Checker e Guardrails: engineering/maker-checker.md
      - Avaliação Contínua (Evals): engineering/harness-evals.md
      - MLOps: engineering/mlops.md
  - Operação:
      - DevOps e CI/CD: development/devops.md
      - Segurança, LGPD e Auditoria: planning/governance-security.md
      - Governança do Repositório: development/governance.md
  - Desenvolvimento:
      - Início Rápido: development/quickstart.md
      - Referência da API REST: development/api-reference.md
      - Quality Gates e Testes: development/quality-gates.md
  - Gestão:
      - Plano de Entrega (05/12/2026): planning/DELIVERY_PLAN_2026_12_05.md
      - Backlog de Implementação: planning/IMPLEMENTATION_BACKLOG.md
      - Relatório de Validação: planning/VALIDATION_REPORT.md
      - Log de Defeitos do Fluxo Inicial: planning/log_defeitos_fluxo_inicial.md
      - Histórico:
          - Planejamento Inicial: planning/project-plan.md
          - Cronograma Original de Sprints: planning/sprints-roadmap.md
