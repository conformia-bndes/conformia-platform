site_name: "Conform.IA BNDES - Documentacao Tecnica"
site_description: "Plataforma de Intelligent Document Processing (IDP) e Auditoria Imutavel - Consulta Publica BNDES no 01/2025"
site_url: "https://conformia-bndes.github.io/conformia-platform/"
repo_url: "https://github.com/conformia-bndes/conformia-platform"
repo_name: "conformia-bndes/conformia-platform"

theme:
  name: material
  language: pt
  icon:
    repo: fontawesome/brands/github
  palette:
    # Modo Claro Institucional
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    # Modo Escuro de Alta Legibilidade
    - scheme: slate
      primary: slate
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/extra.js

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      type: timeago
  - minify:
      minify_html: true

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - Planejamento:
      - Visao Geral: planning/index.md
      - Requisitos e Escopo: planning/requirements.md
      - Arquitetura da Solucao: planning/architecture-design.md
      - Cronograma e Sprints: planning/sprints-roadmap.md
      - Seguranca e Governanca: planning/governance-security.md
      - Harness Engineering: planning/harness-engineering.md
      - Plano Consolidado (Master): planning/project-plan.md
  - Arquitetura:
      - Visao Geral: architecture/overview.md
      - Decisoes Arquiteturais (ADRs):
          - Indice: architecture/adr-index.md
          - ADR-001 Monorepo Modular: architecture/adr-001-monorepo-modular.md
          - ADR-002 Adoção do Astral uv: architecture/adr-002-astral-uv-toolchain.md
          - ADR-003 React SPA vs Next.js: architecture/adr-003-spa-vs-nextjs.md
          - Template de ADR: architecture/adr-template.md
  - Desafio BNDES:
      - Analise do Edital: bndes/compliance-matrix.md
      - Tipologias de Documentos: bndes/document-types.md
  - Engenharia IDP e IA:
      - Pipeline IDP e OCR: engineering/idp-pipeline.md
      - Motor de Regras: engineering/rules-engine.md
      - Harness e Avaliacao de IA: engineering/harness-evals.md
  - Desenvolvimento e APIs:
      - Inicio Rapido (Quickstart): development/quickstart.md
      - Referencia da API REST: development/api-reference.md
      - Quality Gates e Testes: development/quality-gates.md
